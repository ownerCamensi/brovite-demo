<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brovite Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 32px;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      max-width: 720px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #243041;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    a.button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 18px;
      border-radius: 12px;
      background: #38bdf8;
      color: #00111a;
      text-decoration: none;
      font-weight: 700;
    }
    code, pre {
      background: #0b1220;
      border-radius: 12px;
      padding: 14px;
      overflow: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ Brovite Demo</h1>
    <p>A small public demo project for Brovite.</p>

    <h2>Download Code</h2>
    <a class="button" href="https://github.com/your-username/brovite-demo" target="_blank" rel="noreferrer">
      Open GitHub Repo
    </a>

    <h2>Clone</h2>
    <pre><code>git clone https://github.com/your-username/brovite-demo.git
cd brovite-demo
npm install
brovite dev</code></pre>

    <p>Replace <code>your-username</code> with your real GitHub username.</p>
  </div>
</body>
</html>
